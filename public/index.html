<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My YouTube Viewer</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1e1e1e;
      color: #fff;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background: #ff0000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .player-wrapper {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <h2>YouTube Viewer</h2>
  <div class="controls">
    <input type="text" id="videoInput" placeholder="YouTubeのURL または 動画IDを入力">
    <button onclick="loadVideo()">再生</button>
  </div>
  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <script>
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

    let player;
    function onYouTubeIframeAPIReady() {
      const urlParams = new URLSearchParams(window.location.search);
      const initialId = urlParams.get('v') || 'M7lc1UVf-VE';
      player = new YT.Player('player', {
        videoId: initialId,
        playerVars: { 'playsinline': 1, 'rel': 0 }
      });
    }

    function extractVideoId(input) {
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = input.trim().match(regExp);
      if (match && match[1]) return match[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(input.trim())) return input.trim();
      return null;
    }

    function loadVideo() {
      const videoId = extractVideoId(document.getElementById('videoInput').value);
      if (!videoId) return alert('有効なYouTubeのURLまたはIDを入力してください');
      if (player && player.loadVideoById) player.loadVideoById(videoId);
    }
  </script>
</body>
</html>
